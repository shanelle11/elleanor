<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Shanelle's Portfolio</title>
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Varela+Round&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Floating decorations -->
    <img src="image-01.png" alt="" class="floating-decoration" style="top: 10%; left: 5%; animation-delay: 0s;">
    <img src="image-02.png" alt="" class="floating-decoration" style="top: 20%; right: 10%; animation-delay: 1s;">
    <img src="image-03.png" alt="" class="floating-decoration" style="bottom: 15%; left: 8%; animation-delay: 2s;">
    <img src="image-04.png" alt="" class="floating-decoration" style="top: 60%; right: 5%; animation-delay: 1.5s;">
    <img src="image-05.png" alt="" class="floating-decoration" style="bottom: 25%; right: 15%; animation-delay: 0.5s;">
    <img src="image-06.png" alt="" class="floating-decoration" style="top: 40%; left: 10%; animation-delay: 2.5s;">

    <div class="login-container">
        <div class="login-box">
            <h1 class="login-title">✨ Welcome ✨</h1>
            <p class="login-subtitle">Enter to view Shanelle's Portfolio</p>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>
                
                <div class="error-message" id="errorMessage" style="display: none;">
                    ❌ Invalid username or password
                </div>
                
                <button type="submit" class="login-button">Enter Portfolio</button>
            </form>
        </div>
    </div>

    <!-- User credentials database -->
    <script src="credentials.js"></script>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const loginBox = document.querySelector('.login-box');
            
            // Validate credentials using the database
            const result = validateCredentials(username, password);
            
            if (result.success) {
                // Set session storage
                sessionStorage.setItem('isLoggedIn', 'true');
                sessionStorage.setItem('username', result.username);
                
                // Redirect to main page
                window.location.href = 'index.html';
            } else {
                // Show error message
                errorMessage.textContent = '❌ ' + result.message;
                errorMessage.style.display = 'block';
                loginBox.classList.add('shake');
                
                // Remove shake animation after it completes
                setTimeout(() => {
                    loginBox.classList.remove('shake');
                }, 500);
                
                // Hide error message after 3 seconds
                setTimeout(() => {
                    errorMessage.style.display = 'none';
                }, 3000);
            }
        });
    </script>
</body>
</html>
